; Review-only template: substitute actual paths/user before installation.
; Example process counts must be sized with the actual race schedule and VPS RAM.
; 240s worker timeout < 300s queue retry_after; dedicated deadline workers never call AI.
[program:baganriki-r122-freeze]
process_name=%(program_name)s_%(process_num)02d
directory=__APP_DIR__
command=__PHP_BIN__ __APP_DIR__/artisan queue:work baganriki_database --queue=r122-freeze --sleep=1 --tries=1 --timeout=120 --max-time=3600
numprocs=2
user=__APP_USER__
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/r122-freeze-%(process_num)02d.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

